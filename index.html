  <style>
    :root {
      --bg: #0b1120;
      --surface: #111827;
      --card: #162033;
      --card-2: #1d2b45;
      --text: #f8fafc;
      --muted: #94a3b8;
      --gold: #f59e0b;
      --gold-2: #fbbf24;
      --blue: #2563eb;
      --green: #10b981;
      --teal: #0d9488;
      --danger: #ef4444;
      --border: rgba(148, 163, 184, 0.18);
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
    body { margin: 0; background: radial-gradient(circle at top, #172554 0%, var(--bg) 55%); color: var(--text); padding: 14px; line-height: 1.65; }
    .container { max-width: 980px; margin: 0 auto; }

    .bilingual-block { display: flex; flex-direction: column; gap: 3px; }
    .line-ar { direction: rtl; text-align: start; unicode-bidi: isolate; }
    .line-en { direction: ltr; text-align: start; unicode-bidi: isolate; }
    .inline-en { direction: ltr; unicode-bidi: isolate; display: inline-block; }

    .nav {
      display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
      background: rgba(17, 24, 39, 0.92); border: 1px solid var(--border); border-radius: 16px; padding: 12px 16px; margin-bottom: 16px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 0.98rem; color: var(--gold-2); }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); flex-shrink: 0; }
    .nav-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    select, .pill-btn {
      background: var(--card-2); color: var(--text); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 12px; font-size: 0.85rem; font-weight: 700; cursor: pointer; text-decoration: none;
    }
    .pill-btn.gold { background: linear-gradient(135deg, var(--gold), var(--gold-2)); color: #0f172a; border: 0; }

    .hero {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.24), rgba(16, 185, 129, 0.14)), var(--surface);
      border: 1px solid var(--border); border-radius: 20px; padding: 22px; margin-bottom: 18px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
    }
    .hero-badge {
      display: inline-block; background: rgba(245, 158, 11, 0.16); color: var(--gold-2);
      border: 1px solid rgba(245, 158, 11, 0.35); padding: 4px 12px; border-radius: 999px;
      font-size: 0.8rem; font-weight: 700; margin-bottom: 10px; unicode-bidi: isolate;
    }
    .hero h1 { margin: 0 0 8px; font-size: 1.38rem; font-weight: 900; }
    .hero p { margin: 0 0 14px; color: var(--muted); font-size: 0.94rem; }
    .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
    .feat { background: rgba(15, 23, 42, 0.78); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font-size: 0.85rem; }

    .section {
      background: rgba(17, 24, 39, 0.9); border: 1px solid var(--border); border-radius: 20px;
      padding: 18px; margin-bottom: 18px; box-shadow: 0 10px 26px rgba(0, 0, 0, 0.25);
    }
    .section-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .section-title { margin: 0; font-size: 1.1rem; font-weight: 800; }

    .gateways-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
    .gateway-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px;
      display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
    }
    .gw-name { font-weight: 800; font-size: 0.96rem; color: var(--gold-2); }
    .gw-desc { font-size: 0.84rem; color: var(--muted); margin: 6px 0 0; }

    .grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
    @media (min-width: 660px) { .grid { grid-template-columns: repeat(2, 1fr); } }

    .product-card {
      background: linear-gradient(180deg, var(--card) 0%, var(--card-2) 100%);
      border: 1px solid var(--border); border-radius: 16px; padding: 16px;
      display: flex; flex-direction: column; justify-content: space-between; gap: 14px;
    }
    .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
    .cat-tag { font-size: 0.76rem; font-weight: 700; color: var(--gold-2); background: rgba(245, 158, 11, 0.14); padding: 4px 10px; border-radius: 12px; }
    .price-tag { font-size: 1rem; font-weight: 900; color: #34d399; background: rgba(16, 185, 129, 0.14); border: 1px solid rgba(16, 185, 129, 0.3); padding: 3px 10px; border-radius: 999px; direction: ltr; unicode-bidi: isolate; flex-shrink: 0; }
    .p-title { font-size: 1.04rem; font-weight: 800; margin-bottom: 6px; }
    .p-desc { font-size: 0.87rem; color: var(--muted); margin: 0; }

    .btn {
      width: 100%; border: 0; border-radius: 12px; padding: 10px 14px;
      font-size: 0.92rem; font-weight: 800; cursor: pointer; color: #fff; text-decoration: none;
      display: inline-block; text-align: center;
    }
    .btn-buy { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
    .btn-ext { background: linear-gradient(135deg, var(--teal), #0f766e); }
    .btn-gold { background: linear-gradient(135deg, var(--gold), var(--gold-2)); color: #0f172a; margin-top: 10px; }
    .btn-green { background: linear-gradient(135deg, #059669, #10b981); margin-top: 8px; }
    .btn-gray { background: #334155; margin-top: 8px; }
    .btn-reset { background: var(--danger); width: auto; padding: 8px 14px; font-size: 0.84rem; }

    .order-item { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 10px; font-size: 0.88rem; }
    .muted { color: var(--muted); font-size: 0.86rem; }

    .modal-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(2, 6, 23, 0.82);
      align-items: center; justify-content: center; padding: 14px; z-index: 999;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      width: 100%; max-width: 490px; padding: 20px; max-height: 92vh; overflow-y: auto;
    }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .close-x { background: var(--card-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 5px 11px; font-weight: 700; cursor: pointer; }
    label { display: block; font-size: 0.86rem; font-weight: 700; margin: 10px 0 4px; color: #e2e8f0; }
    input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 0.94rem; }
    .secret-box { display: none; margin-top: 12px; padding: 12px; border-radius: 12px; background: rgba(37, 99, 235, 0.16); border: 1px solid rgba(96, 165, 250, 0.45); font-size: 0.9rem; }
    .secret-box.show { display: block; }
    .status-note { margin-top: 10px; font-size: 0.86rem; font-weight: 700; color: #34d399; }

    let currentLang = "ar";
    let selectedItem = null;
    let bankVisible = false;

    function setLanguage(code) {
      currentLang = LANG_META[code] ? code : "ar";
      const m = LANG_META[currentLang];
      const r = m.otherRtl;
      document.documentElement.lang = currentLang;
      document.documentElement.dir = m.dir;
      document.getElementById("langSelect").value = currentLang;
      document.getElementById("uiBadge").textContent = m.badge;
      document.getElementById("uiHeroTitle").innerHTML = bilingualHtml(m.heroTitleAr, m.heroTitleEn, r);
      document.getElementById("uiHeroSub").innerHTML = bilingualHtml(m.heroSubAr, m.heroSubEn, r);
      document.getElementById("uiF1").innerHTML = bilingualHtml(m.f1Ar, m.f1En, r);
      document.getElementById("uiF2").innerHTML = bilingualHtml(m.f2Ar, m.f2En, r);
      document.getElementById("uiF3").innerHTML = bilingualHtml(m.f3Ar, m.f3En, r);
      document.getElementById("uiGwTitle").innerHTML = bilingualHtml(m.gwTitleAr, m.gwTitleEn, r);
      document.getElementById("uiProdTitle").innerHTML = bilingualHtml(m.prodTitleAr, m.prodTitleEn, r);
      document.getElementById("uiOrdTitle").innerHTML = bilingualHtml(m.ordTitleAr, m.ordTitleEn, r);
      document.getElementById("uiResetBtn").innerHTML = bilingualHtml(m.resetAr, m.resetEn, r);
      document.getElementById("uiMTitle").innerHTML = bilingualHtml(m.mTitleAr, m.mTitleEn, r);
      document.getElementById("uiLName").innerHTML = bilingualHtml(m.lNameAr, m.lNameEn, r);
      document.getElementById("uiLContact").innerHTML = bilingualHtml(m.lContactAr, m.lContactEn, r);
      document.getElementById("uiLRef").innerHTML = bilingualHtml(m.lRefAr, m.lRefEn, r);
      document.getElementById("uiBReveal").innerHTML = bilingualHtml(m.bRevealAr, m.bRevealEn, r);
      document.getElementById("uiBEmail").innerHTML = bilingualHtml(m.bEmailAr, m.bEmailEn, r);
      document.getElementById("uiBCopy").innerHTML = bilingualHtml(m.bCopyAr, m.bCopyEn, r);

      renderGateways();
      renderProducts();
      renderBankSecret();
      renderOrders();
    }

    function renderGateways() {
      const r = LANG_META[currentLang].otherRtl;
      document.getElementById("gatewaysGrid").innerHTML = CONFIG.externalGateways.map(g => {
        const ctaHtml = bilingualHtml(g.ctaAr, g.ctaEn, r);
        let actionHtml = "";
        if (g.type === "internal_bankak") {
          actionHtml = `<button class="btn btn-buy" onclick="openModal(0)">${ctaHtml}</button>`;
        } else if (g.type === "external_url") {
          actionHtml = `<a class="btn btn-ext" href="${g.url}" target="_blank" rel="noopener">${ctaHtml}</a>`;
        } else {
          actionHtml = `<button class="btn btn-green" style="margin-top:0;" onclick="openModal(0)">${ctaHtml}</button>`;
        }
        return `
          <div class="gateway-card">
            <div>
              <div class="gw-name">${bilingualHtml(g.titleAr, g.titleEn, r)}</div>
              <div class="gw-desc">${bilingualHtml(g.descAr, g.descEn, r)}</div>
            </div>
            ${actionHtml}
          </div>
        `;
      }).join("");
    }

    function renderProducts() {
      const m = LANG_META[currentLang];
      const r = m.otherRtl;
      document.getElementById("productsGrid").innerHTML = PRODUCTS.map((p, idx) => `
        <div class="product-card">
          <div>
            <div class="top-row">
              <span class="cat-tag">${bilingualHtml(p.tagAr, p.tagEn, r)}</span>
              <span class="price-tag">${p.price}</span>
            </div>
            <div class="p-title">${bilingualHtml(p.nameAr, p.nameEn, r)}</div>
            <div class="p-desc">${bilingualHtml(p.descAr, p.descEn, r)}</div>
          </div>
          <button class="btn btn-buy" onclick="openModal(${idx})">${bilingualHtml(m.buyAr, m.buyEn, r)}</button>
        </div>
      `).join("");
    }

    function renderBankSecret() {
      const box = document.getElementById("bankBox");
      if (!bankVisible) {
        box.classList.remove("show");
        box.innerHTML = "";
        return;
      }
      box.classList.add("show");
      box.innerHTML = `
        <div class="line-ar"><strong>${CONFIG.bankName}:</strong> <span class="inline-en">${CONFIG.bankAccount}</span></div>
        <div class="line-en"><strong>Email:</strong> ${CONFIG.merchantEmail}</div>
      `;
    }

    function openModal(index) {
      selectedItem = PRODUCTS[index] || PRODUCTS[0];
      bankVisible = false;
      document.getElementById("uiMStatus").textContent = "";
      document.getElementById("uiMProduct").innerHTML = `
        ${bilingualHtml(selectedItem.nameAr, selectedItem.nameEn, LANG_META[currentLang].otherRtl)}
        <div class="line-en"><strong>${selectedItem.price}</strong></div>
      `;
      renderBankSecret();
      document.getElementById("checkoutModal").classList.add("open");
    }

    function closeModal() {
      document.getElementById("checkoutModal").classList.remove("open");
    }

    function setStatusMsg(arMsg, enMsg) {
      document.getElementById("uiMStatus").innerHTML = bilingualHtml(arMsg, enMsg, LANG_META[currentLang].otherRtl);
    }

    function revealBank() {
      const m = LANG_META[currentLang];
      const name = document.getElementById("inName").value.trim();
      const contact = document.getElementById("inContact").value.trim();
      if (!name || !contact) {
        setStatusMsg(m.needInfoAr, m.needInfoEn);
        return;
      }
      bankVisible = true;
      renderBankSecret();
      setStatusMsg(m.shownAr, m.shownEn);
    }

    function buildOrderSummary() {
      const name = document.getElementById("inName").value.trim() || "N/A";
      const contact = document.getElementById("inContact").value.trim() || "N/A";
      const ref = document.getElementById("inRef").value.trim() || "N/A";
      const prod = selectedItem ? `${selectedItem.nameAr} | ${selectedItem.nameEn}` : "";
      const price = selectedItem ? selectedItem.price : "";
      return [
        "Mizan Baha Global Store Order | متجر ميزان بهاء العالمي",
        "Product: " + prod,
        "Price: " + price,
        "Customer: " + name,
        "Contact: " + contact,
        "Bankak Account: " + CONFIG.bankAccount,
        "Bankak Ref: " + ref
      ].join("\n");
    }

    function getOrdersList() {
      try {
        const raw = JSON.parse(localStorage.getItem(CONFIG.storageKey) || "[]");
        return Array.isArray(raw) ? raw : [];
      } catch {
        return [];
      }
    }

    function saveOrder() {
      const name = document.getElementById("inName").value.trim() || "Customer";
      const contact = document.getElementById("inContact").value.trim() || "N/A";
      const ref = document.getElementById("inRef").value.trim() || "Pending";
      const prod = selectedItem ? `${selectedItem.nameAr} | ${selectedItem.nameEn}` : "Order";
      const price = selectedItem ? selectedItem.price : "";
      const list = getOrdersList();
      list.unshift({ id: list.length + 1, prod, price, name, contact, ref, time: new Date().toLocaleString() });
      localStorage.setItem(CONFIG.storageKey, JSON.stringify(list));
      renderOrders();
    }

    function sendEmail() {
      saveOrder();
      const m = LANG_META[currentLang];
      const subject = encodeURIComponent("New Order - Mizan Baha Global Store");
      const body = encodeURIComponent(buildOrderSummary());
      setStatusMsg(m.sentAr, m.sentEn);
      window.location.href = `mailto:${CONFIG.merchantEmail}?subject=${subject}&body=${body}`;
    }

    function copySummary() {
      const m = LANG_META[currentLang];
      const text = buildOrderSummary();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          setStatusMsg(m.copiedAr, m.copiedEn);
        }).catch(() => {
          setStatusMsg(m.copyErrAr, m.copyErrEn);
        });
      }
    }

    function renderOrders() {
      const m = LANG_META[currentLang];
      const r = m.otherRtl;
      const el = document.getElementById("ordersContainer");
      const list = getOrdersList();
      if (!list.length) {
        el.innerHTML = bilingualHtml(m.emptyAr, m.emptyEn, r);
        return;
      }
      el.innerHTML = list.map(o => `
        <div class="order-item">
          <div><strong>#${o.id} — ${o.prod}</strong> <span class="inline-en">(${o.price})</span></div>
          <div class="muted line-en">${o.name} | ${o.contact} | Ref: ${o.ref} | ${o.time}</div>
        </div>
      `).join("");
    }

    function resetStore() {
      [
        "mizan_global_fixed_orders_v1",
        "mizan_global_dual_lang_orders_v1",
        "mizan_all_in_one_orders_v1",
        "mizan_modern_store_orders_v1",
        "mizan_bilingual_orders_v1",
        "mizan_store_final_orders_v1",
        "mizan_orders_v3",
        "mizan_baha_orders_v2",
        "mizan_baha_orders"
      ].forEach(k => localStorage.removeItem(k));
      renderOrders();
    }

    setLanguage("ar");
  </script>
</body>
</html>
